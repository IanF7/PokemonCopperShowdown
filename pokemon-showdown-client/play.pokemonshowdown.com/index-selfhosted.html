		<script>
			// Page served by our own Pokemon Showdown server (see Config.clientdir in
			// pokemon-showdown/config/config.js). Vanilla sprites/sounds still come from
			// play.pokemonshowdown.com; custom ones come from this server.
			function loadRemoteData(src) {
				var scriptEl = document.createElement('script');
				scriptEl.src = src.replace(/.*\/(data|js)\//g, 'https://play.pokemonshowdown.com/$1/');
				document.head.appendChild(scriptEl);
			}
			Config.selfhosted = true;
			// connect back to whichever address this page was loaded from
			// (localhost, the VM's IP, or a domain name) -- no config edits needed
			Config.server = {
				id: 'copper',
				host: location.hostname,
				port: parseInt(location.port, 10) || (location.protocol === 'https:' ? 443 : 80),
				https: location.protocol === 'https:',
				registered: true
			};
		</script>
		<!--[if lte IE 8]><script>
			Config.oldie = true;
		</script><![endif]-->
